<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Investment Calculator</title>
  </head>
  <body>
    <h1>Investment Calculator</h1>

    <form id="calculatorForm">
      <div>
        <label for="cashBalance">Cash Balance:</label>
        <input type="text" id="cashBalance" name="cashBalance" required />
      </div>

      <h2>TQQQ Section</h2>
      <div>
        <label for="tqqqAmount">TQQQ Amount:</label>
        <select id="tqqqAmount" name="tqqqAmount" required>
          <option value="225">225 (above 100 and 200 MA)</option>
          <option value="1000">1000 (below 100 and 200 MA)</option>
        </select>
      </div>

      <div>
        <label for="qqqPrice">QQQ Price:</label>
        <input type="text" id="qqqPrice" name="qqqPrice" required />
      </div>

      <div>
        <label for="qqq200Ma">QQQ 200 MA:</label>
        <input type="text" id="qqq200Ma" name="qqq200Ma" required />
      </div>

      <h2>UPRO Section</h2>
      <div>
        <label for="uproAmount">UPRO Amount:</label>
        <select id="uproAmount" name="uproAmount" required>
          <option value="25">25 (above 100 and 200 MA)</option>
          <option value="750">750 (below 100 and 200 MA)</option>
        </select>
      </div>

      <div>
        <label for="vooPrice">VOO Price:</label>
        <input type="text" id="vooPrice" name="vooPrice" required />
      </div>

      <div>
        <label for="voo200Ma">VOO 200 MA:</label>
        <input type="text" id="voo200Ma" name="voo200Ma" required />
      </div>

      <button type="submit">Calculate</button>
    </form>

    <div id="result"></div>

    <hr style="margin: 40px 0;" />

    <h1>Tax Bracket Calculator</h1>

    <div id="taxCalculatorSection">
      <div>
        <label for="taxBracket">Tax Bracket:</label>
        <select id="taxBracket" name="taxBracket" required>
          <option value="0.32">$191,950–$243,725 (32%)</option>
        </select>
      </div>

      <div style="margin-top: 15px;">
        <label for="ytdEarnings">YTD Earnings:</label>
        <input type="text" id="ytdEarnings" name="ytdEarnings" required />
      </div>

      <div style="margin-top: 15px;">
        <label for="stockPrice">Stock Price:</label>
        <input type="text" id="stockPrice" name="stockPrice" required />
      </div>

      <div style="margin-top: 15px;">
        <button type="button" id="taxCalculateButton">Calculate</button>
      </div>

      <div id="taxResult" style="margin-top: 15px;"></div>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
